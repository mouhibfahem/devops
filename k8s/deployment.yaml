apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashcards-api
  namespace: flashcards
  labels:
    app: flashcards-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flashcards-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # keep serving during updates
      maxSurge: 1
  template:
    metadata:
      labels:
        app: flashcards-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: mouhibfahem/flashcards-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: flashcards-api-config
          readinessProbe: # receive traffic only when ready
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe: # restart the container if it stops answering
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
