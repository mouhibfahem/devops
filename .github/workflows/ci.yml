name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Static checks (go vet)
        run: go vet ./...

      - name: Unit tests with race detector and coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          echo "### Test coverage: $(tail -1 coverage.txt | awk '{print $3}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the binary
        run: go build -o bin/api .

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  sast:
    name: SAST (gosec, govulncheck, gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload gosec results to GitHub code scanning
    steps:
      - name: Check out the code (full history for gitleaks)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gosec — static analysis of the Go code
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          mkdir -p reports
          gosec -fmt sarif -out reports/gosec.sarif -stdout -verbose=text ./...

      - name: govulncheck — known vulnerabilities in Go and dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... | tee reports/govulncheck.txt

      - name: gitleaks — secrets committed in the git history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0             git /repo --no-banner --report-format json --report-path /repo/reports/gitleaks.json

      - name: Upload gosec results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/gosec.sarif
          category: gosec

      - name: Keep SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: reports/

  image:
    name: Build and scan Docker image (Trivy)
    needs: [build-and-test, sast]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: flashcards-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — vulnerabilities in the image (fails on fixable HIGH/CRITICAL)
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/reports"             aquasec/trivy:0.66.0 image --format table --output /reports/trivy.txt flashcards-api:ci
          cat reports/trivy.txt
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy:0.66.0 image --quiet --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL flashcards-api:ci

      - name: Save the image for the next jobs
        run: docker save flashcards-api:ci -o reports/image.tar

      - name: Share the image
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: reports/image.tar
          retention-days: 1

      - name: Keep the Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: reports/trivy.txt

  dast:
    name: DAST (OWASP ZAP API scan)
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Get the image
        uses: actions/download-artifact@v5
        with:
          name: image

      - name: Start the API
        run: |
          docker load -i image.tar
          docker run -d --name api -p 8080:8080 flashcards-api:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8080/health && break; sleep 1; done

      - name: ZAP API scan against the running API
        run: |
          mkdir -p reports && chmod 777 reports
          cp openapi.yaml reports/openapi.yaml
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable             zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi             -r zap-report.html -J zap-report.json -w zap-report.md -I
          cat reports/zap-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            reports/zap-report.html
            reports/zap-report.json
            reports/zap-report.md

  publish:
    name: Push Docker image to Docker Hub
    needs: [image, dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/flashcards-api
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags (latest + commit SHA)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same Dockerfile and build cache as the scanned image, so this only re-tags and pushes it.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
